[project]
name = "pinn3d"
version = "0.1.0"
description = "Scientific ML experiments: legacy 3D PINNs and diffusion-guided nonlinear elliptic solvers"
requires-python = ">=3.12"
dependencies = [
    "jax==0.9.0",
    "equinox==0.13.2",
    "fastapi==0.124.0",
    "pyngrok==7.5.0",
    "torch",
    "uvicorn",
    "optax",
    "numpy",
    "scipy",
    "pydantic",
    "matplotlib",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
